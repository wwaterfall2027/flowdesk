name: FlowDesk daily brief

on:
  schedule:
    - cron: '30 2 * * *'   # 02:30 UTC daily, after US ETF flow data for the prior day is out
  workflow_dispatch: {}

permissions:
  contents: write   # commit the new brief to docs/
  models: read      # GitHub Models for the optional AI-written summary

concurrency:
  group: flowdesk-daily
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test the signal engine
        run: node tests/run-node.mjs

      - name: Run the agent
        env:
          SOSOVALUE_API_KEY: ${{ secrets.SOSOVALUE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node agent/run.mjs

      - name: Commit the brief
        run: |
          git config user.name "flowdesk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/feed.xml
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Daily brief $(date -u +%Y-%m-%d)"
          git push
